[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-vibe-engineering"
version = "0.8.2"
description = "SAGE Vibe Engineering Protocol and Runtime Kit SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SAGE Contributors" }]
dependencies = []

[project.scripts]
sage-sdk = "sage_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
