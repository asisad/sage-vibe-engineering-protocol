name: SAGE CI

on:
  push:
  pull_request:

jobs:
  ruflo-mcp-transport:
    name: Ruflo MCP boundary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate optional runtime manifest and policy
        run: python -c "import json,pathlib; p=pathlib.Path('extensions/ruflo'); m=json.loads((p/'manifest.json').read_text()); s=json.loads((p/'policy.json').read_text()); assert m['upstream']['npm_package']=='ruflo@3.61.1'; assert not m['live_enabled_by_default']; assert s['execution']['no_shell']"
      - name: MCP handshake, scope, approvals, errors, timeouts and synthetic evidence
        run: python tools/test_sage_ruflo.py
      - name: Independent live-acceptance gate regression (offline fixture)
        run: python tools/test_ruflo_live_acceptance.py
      - name: PowerShell Ruflo status entrypoint
        shell: pwsh
        run: |
          $out = ./sage.ps1 ruflo -RufloAction status | ConvertFrom-Json
          if ($out.executed -or $out.runtime_connected -or $out.status -ne 'AVAILABLE_NOT_ACTIVATED') { throw 'Unexpected Ruflo autoactivation' }

  ecc-catalog-and-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned source inventory and catalog contracts
        run: python tools/Verify-SageEccCatalog.py
      - name: Exercise source-packet boundaries
        run: python tools/test_sage_ecc.py
      - name: Exercise real catalog workflows
        run: python tools/test_sage_ecc_integration.py
  contracts-and-reference-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check catalog JSON schema and PowerShell discovery entrypoint
        shell: pwsh
        run: |
          $catalog = Get-Content extensions/ecc/catalog.json -Raw
          if (-not (Test-Json -Json $catalog -SchemaFile schemas/extensions/sage-ecc-catalog.schema.json)) { throw 'ECC catalog schema validation failed.' }
          $reply = ./sage.ps1 catalog -CatalogAction search -Query 'Rust ownership' | ConvertFrom-Json -Depth 100
          if (-not $reply.ok -or $reply.execution_authorized -or @($reply.data.entries).Count -eq 0) { throw 'ECC catalog CLI contract failed.' }
      - name: Run SAGE unified CI
        shell: pwsh
        run: ./tools/Invoke-SageReferenceCI.ps1 -EvidencePath ./tmp/ci-result.json
      - name: Preserve CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: sage-ci-evidence
          path: tmp/ci-result.json
          if-no-files-found: error
