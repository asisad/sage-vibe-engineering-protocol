[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-runtime"
version = "0.1.0"
description = "Bounded, evidence-led SAGE autonomous execution runtime"
readme = "README.fa-en.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0 AND CC-BY-SA-4.0"
authors = [{ name = "SAGE Contributors" }]
dependencies = []

[project.scripts]
sage = "sage_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sage_runtime*"]
namespaces = false

[tool.setuptools]
include-package-data = false
